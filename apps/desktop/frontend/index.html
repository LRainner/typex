    const recordStateLabel = document.getElementById('record-state-label');
    const recordLevelSection = document.getElementById('record-level-section');
    const recordLevelFill = document.getElementById('record-level-fill');
    let recordingState = 'idle'; // 'idle' | 'recording' | 'transcribing'
    let timerStart = null;
    let timerInterval = null;

    function setRecordingState(state) {
      recordingState = state;
      recordBtn.classList.remove('recording', 'transcribing');
      recordStatus.classList.remove('recording-state', 'transcribing-state');
      recordStatePill.classList.remove('recording-state', 'transcribing-state');

      if (state === 'idle') {
        recordBtn.classList.remove('recording', 'transcribing');
        recordStatus.textContent = typexI18n.t('record.idle');
        recordStateLabel.textContent = typexI18n.t('record.ready');
        recordTimer.style.display = 'none';
        recordLevelSection.style.display = 'none';
        stopTimer();
      } else if (state === 'recording') {
        recordBtn.classList.add('recording');
        recordStatus.classList.add('recording-state');
        recordStatePill.classList.add('recording-state');
        recordStatus.textContent = typexI18n.t('record.recording');
        recordStateLabel.textContent = typexI18n.t('record.listening');
        recordTimer.style.display = 'block';
        recordLevelSection.style.display = 'block';
        startTimer();
      } else if (state === 'transcribing') {
        recordBtn.classList.add('transcribing');
        recordStatus.classList.add('transcribing-state');
        recordStatePill.classList.add('transcribing-state');
        recordStatus.textContent = typexI18n.t('record.transcribing');
        recordStateLabel.textContent = typexI18n.t('record.processing');
        recordLevelSection.style.display = 'none';
        stopTimer();
      }
      updateRecordButtonA11y();
    }

    function startTimer() {
      timerStart = Date.now();
      recordTimer.textContent = '00:00';
      timerInterval = setInterval(() => {
        const elapsed = Math.floor((Date.now() - timerStart) / 1000);
        const mins = String(Math.floor(elapsed / 60)).padStart(2, '0');
        const secs = String(elapsed % 60).padStart(2, '0');
        recordTimer.textContent = `${mins}:${secs}`;
      }, 1000);
    }

    function stopTimer() {
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    }

    // Record button click → toggle recording
    recordBtn.addEventListener('click', () => {
      if (recordingState === 'transcribing') return; // disabled during transcribing
      invoke('handle_record_toggle_cmd');
    });

    // Populate audio device dropdown in recording view
    async function loadRecordDevices() {
      const select = document.getElementById('record-audio-device');
      try {
        const devices = await invoke('list_audio_devices');
        const currentDevice = currentConfig ? (currentConfig.audio.device || '') : '';
        select.innerHTML = `<option value="">${typexI18n.t('settings.audio_device_default')}</option>`;
        devices.forEach(name => {
          const opt = document.createElement('option');
          opt.value = name;
          opt.textContent = name;
          if (name === currentDevice) opt.selected = true;
          select.appendChild(opt);
        });
      } catch { select.innerHTML = `<option value="">${typexI18n.t('settings.audio_device_default')}</option>`; }
    }

    // Audio device change in recording view → sync to settings
    document.getElementById('record-audio-device').addEventListener('change', (e) => {
      document.getElementById('audio-device').value = e.target.value;
      document.getElementById('audio-device').dispatchEvent(new Event('change', { bubbles: true }));
    });

    // Audio level from main window Tauri event
    listen('audio-level', (event) => {
      if (recordingState !== 'recording') return;
      const rms = event.payload.rms || 0;
      // Scale RMS for visual: clamp 0-1, use exponential for visibility
      const pct = Math.min(100, Math.round(rms * 300));
      recordLevelFill.style.width = pct + '%';
    });

    listen('recording-state', (event) => {
      recordingIndicator.style.display = event.payload.recording ? 'flex' : 'none';
      if (event.payload.recording) {
        setRecordingState('recording');
      } else {
        // Recording stopped → enter transcribing state
        setRecordingState('transcribing');
      }
    });

    listen('history-updated', () => {
      loadHistory();
      // Transcription finished → return to idle
      if (recordingState === 'transcribing') {
        setRecordingState('idle');
      }
    });
  </script>
</body>
</html>
