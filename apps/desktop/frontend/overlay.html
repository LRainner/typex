<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>TypeX Overlay</title>
  <style>
    :root {
      --font: Inter, -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      --font-mono: "Cascadia Code", "Fira Code", "Consolas", monospace;
      --bg: rgba(24, 24, 27, 0.82);
      --surface: rgba(39, 39, 42, 0.9);
      --surface-soft: rgba(255, 255, 255, 0.08);
      --border: rgba(255, 255, 255, 0.12);
      --text: #f4f4f5;
      --text-secondary: #c9c9d1;
      --text-muted: #8b8b98;
      --accent: #34d399;
      --accent-soft: rgba(52, 211, 153, 0.16);
      --success: #34d399;
      --danger: #fb7185;
      --danger-soft: rgba(251, 113, 133, 0.16);
      --warning: #fbbf24;
      --shadow: 0 18px 48px rgba(0, 0, 0, 0.28);
      --radius: 14px;
      --radius-sm: 8px;
      --dot: rgba(255, 255, 255, 0.26);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: rgba(255, 255, 255, 0.86);
        --surface: rgba(255, 255, 255, 0.94);
        --surface-soft: rgba(24, 24, 27, 0.05);
        --border: rgba(24, 24, 27, 0.1);
        --text: #18181b;
        --text-secondary: #5f5f6b;
        --text-muted: #9a9aa5;
        --accent: #0f9f7a;
        --accent-soft: rgba(15, 159, 122, 0.12);
        --success: #0f9f7a;
        --danger: #dc3f4f;
        --danger-soft: rgba(220, 63, 79, 0.12);
        --warning: #c98207;
        --shadow: 0 18px 42px rgba(24, 24, 27, 0.12);
        --dot: rgba(24, 24, 27, 0.2);
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      font-family: var(--font);
    }

    .overlay-stage {
      width: 100%;
      height: 100%;
      padding: 0;
      display: flex;
      align-items: stretch;
      justify-content: center;
      -webkit-app-region: drag;
    }

    .overlay-card {
      width: 100%;
      min-width: 0;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background:
        linear-gradient(135deg, var(--surface), var(--bg)),
        var(--surface);
      box-shadow: var(--shadow);
      backdrop-filter: blur(22px) saturate(1.3);
      -webkit-backdrop-filter: blur(22px) saturate(1.3);
      color: var(--text);
      overflow: hidden;
    }

    .state {
      display: none;
      height: 100%;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
    }

    .state.active { display: flex; }

    .visual {
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      border-radius: 12px;
      background: var(--accent-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
    }

    .state.error .visual {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .content {
      min-width: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .top-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
    }

    .title {
      font-size: 12px;
      font-weight: 650;
      letter-spacing: -0.01em;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .phase {
      flex-shrink: 0;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .detail,
    .preview {
      font-size: 12px;
      line-height: 1.45;
      color: var(--text-secondary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .preview {
      max-width: 180px;
      color: var(--text-muted);
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
      -webkit-app-region: no-drag;
    }

    .action-btn {
      min-height: 24px;
      padding: 4px 8px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface-soft);
      color: var(--text-secondary);
      font: inherit;
      font-size: 11px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }

    .action-btn:hover {
      background: var(--accent-soft);
      border-color: color-mix(in srgb, var(--accent) 42%, var(--border));
      color: var(--text);
    }

    .action-btn:focus-visible {
      outline: 2px solid color-mix(in srgb, var(--accent) 45%, transparent);
      outline-offset: 2px;
    }

    #waveform {
      display: block;
      image-rendering: auto;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid color-mix(in srgb, var(--accent) 30%, transparent);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .status-icon {
      width: 20px;
      height: 20px;
      display: block;
    }

    .pulse-ring {
      position: relative;
      width: 18px;
      height: 18px;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 0 6px var(--accent-soft);
    }

    .pulse-ring::after {
      content: "";
      position: absolute;
      inset: -7px;
      border: 1px solid color-mix(in srgb, var(--accent) 50%, transparent);
      border-radius: inherit;
      animation: pulse 1.6s ease-out infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @keyframes pulse {
      0% { transform: scale(0.72); opacity: 0.8; }
      100% { transform: scale(1.35); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="overlay-stage">
    <div class="overlay-card" role="status" aria-live="polite">
      <div class="state active" id="state-recording">
        <div class="visual" aria-hidden="true">
          <canvas id="waveform"></canvas>
        </div>
        <div class="content">
          <div class="top-line">
            <div class="title">正在监听</div>
            <div class="phase">LISTENING</div>
          </div>
          <div class="detail">TypeX 正在捕捉你的语音</div>
        </div>
      </div>

      <div class="state" id="state-transcribing">
        <div class="visual" aria-hidden="true"><div class="spinner"></div></div>
        <div class="content">
          <div class="top-line">
            <div class="title">正在转写</div>
            <div class="phase">PROCESSING</div>
          </div>
          <div class="detail">正在识别语音并准备输出…</div>
        </div>
      </div>

      <div class="state" id="state-polishing">
        <div class="visual" aria-hidden="true"><div class="spinner"></div></div>
        <div class="content">
          <div class="top-line">
            <div class="title">正在润色</div>
            <div class="phase">POLISHING</div>
          </div>
          <div class="detail">正在优化标点、流畅度和清晰度…</div>
        </div>
      </div>

      <div class="state" id="state-injected">
        <div class="visual" aria-hidden="true">
          <svg class="status-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 6 9 17l-5-5" />
          </svg>
        </div>
        <div class="content">
          <div class="top-line">
            <div class="title">已输入</div>
            <div class="phase">INJECTED</div>
          </div>
          <div class="preview" id="injected-preview">结果已写入目标应用</div>
          <div class="actions">
            <button class="action-btn" type="button" id="copy-result-btn">复制结果</button>
          </div>
        </div>
      </div>

      <div class="state error" id="state-error">
        <div class="visual" aria-hidden="true">
          <svg class="status-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9" />
            <path d="M12 7v6" />
            <path d="M12 17h.01" />
          </svg>
        </div>
        <div class="content">
          <div class="top-line">
            <div class="title">需要处理</div>
            <div class="phase">FAILED</div>
          </div>
          <div class="detail" id="error-msg">未知错误</div>
          <div class="actions">
            <button class="action-btn" type="button" id="copy-error-btn">复制错误</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const states = {
      recording: document.getElementById('state-recording'),
      transcribing: document.getElementById('state-transcribing'),
      polishing: document.getElementById('state-polishing'),
      injected: document.getElementById('state-injected'),
      error: document.getElementById('state-error'),
    };
    const errorMsg = document.getElementById('error-msg');
    const injectedPreview = document.getElementById('injected-preview');
    const copyResultBtn = document.getElementById('copy-result-btn');
    const copyErrorBtn = document.getElementById('copy-error-btn');
    let lastResultText = '';
    let lastErrorText = '';

    var BAR_W = 2;
    var BAR_GAP = 3;
    var NUM_BARS = 7;
    var CANVAS_W = NUM_BARS * BAR_W + (NUM_BARS - 1) * BAR_GAP;
    var CANVAS_H = 24;

    var canvas = document.getElementById('waveform');
    var ctx = canvas.getContext('2d');
    canvas.width = CANVAS_W;
    canvas.height = CANVAS_H;
    canvas.style.width = CANVAS_W + 'px';
    canvas.style.height = CANVAS_H + 'px';

    var barX = [];
    for (var i = 0; i < NUM_BARS; i++) {
      barX[i] = Math.round(i * (BAR_W + BAR_GAP));
    }

    function barToX(i) {
      return (i / (NUM_BARS - 1) - 0.5) * 4;
    }

    var barWeight = [];
    for (var i = 0; i < NUM_BARS; i++) {
      var x = i / (NUM_BARS - 1) * 4 - 2;
      var sigma = 1.5;
      var w = Math.exp(-0.5 * (x / sigma) * (x / sigma));
      barWeight[i] = Math.max(0.45, w);
    }

    var oscillators = [
      { freq: 0.8, phase: 0.0, speed: 1.0, weight: 0.8 },
      { freq: 1.6, phase: 1.2, speed: 1.3, weight: 0.7 },
      { freq: 2.5, phase: 2.8, speed: 0.8, weight: 0.5 },
      { freq: 4.0, phase: 4.1, speed: 0.6, weight: 0.4 },
    ];

    var currentAmp = 0.22;
    var targetAmp = 0.22;
    var SILENCE_THRESHOLD = 0.006;
    var IDLE_AMP = 0.22;
    var MAX_AMP = 1.0;
    var latestLevel = { rms: 0, peak: 0 };
    var rafId = 0;
    var lastFrameTs = 0;
    var reduceMotionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');

    function roundedRect(x, y, w, h, r) {
      if (typeof ctx.roundRect === 'function') {
        ctx.roundRect(x, y, w, h, r);
        return;
      }
      r = Math.min(r, w / 2, h / 2);
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
    }

    function clamp01(v) {
      return Number.isFinite(v) ? Math.max(0, Math.min(1, v)) : 0;
    }

    function getThemeColors() {
      var style = getComputedStyle(document.documentElement);
      return {
        accent: style.getPropertyValue('--accent').trim(),
        dot: style.getPropertyValue('--dot').trim(),
      };
    }

    function drawWaveform(dt) {
      var rms = clamp01(latestLevel.rms);
      var peak = clamp01(latestLevel.peak);
      var rawLevel = rms * 0.75 + peak * 0.25;
      targetAmp = rawLevel < SILENCE_THRESHOLD
        ? IDLE_AMP
        : Math.max(0.35, Math.min(MAX_AMP, Math.sqrt(rawLevel * 8.0)));

      var follow = targetAmp > currentAmp ? 1 - Math.exp(-dt * 18) : 1 - Math.exp(-dt * 7);
      currentAmp += (targetAmp - currentAmp) * follow;
      latestLevel.rms *= Math.exp(-dt * 10);
      latestLevel.peak *= Math.exp(-dt * 14);

      for (var oi = 0; oi < oscillators.length; oi++) {
        var osc = oscillators[oi];
        osc.phase += osc.speed * dt * Math.PI * 2;
        if (osc.phase > Math.PI * 2) osc.phase -= Math.PI * 2;
      }

      var colors = getThemeColors();
      ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
      var centerY = Math.floor(CANVAS_H / 2);
      var maxHalfH = centerY - 2;

      for (var i = 0; i < NUM_BARS; i++) {
        var x = barToX(i);
        var y = 0;
        for (var oi = 0; oi < oscillators.length; oi++) {
          var osc = oscillators[oi];
          y += Math.sin(osc.freq * x + osc.phase) * osc.weight;
        }
        y = y / 2.2;

        var scale = y * barWeight[i] * currentAmp;
        var absScale = Math.abs(scale);
        if (absScale < 0.015) absScale = 0;

        var halfH = Math.max(2, Math.round(absScale * maxHalfH));
        var barTop = centerY - halfH;
        var barH = halfH * 2;

        ctx.fillStyle = barH <= 2 ? colors.dot : colors.accent;
        ctx.beginPath();
        if (barH <= 2) {
          roundedRect(barX[i], centerY - 1, BAR_W, 2, 1);
        } else {
          roundedRect(barX[i], barTop, BAR_W, barH, 1);
        }
        ctx.fill();
      }
    }

    function animationFrame(ts) {
      if (!lastFrameTs) lastFrameTs = ts;
      var dt = Math.min(0.05, Math.max(0.001, (ts - lastFrameTs) / 1000));
      lastFrameTs = ts;
      drawWaveform(dt);
      rafId = requestAnimationFrame(animationFrame);
    }

    function startWaveform() {
      if (reduceMotionQuery.matches) {
        drawWaveform(0.016);
        return;
      }
      if (!rafId) {
        lastFrameTs = 0;
        rafId = requestAnimationFrame(animationFrame);
      }
    }

    function stopWaveform() {
      if (rafId) {
        cancelAnimationFrame(rafId);
        rafId = 0;
      }
    }

    function resetWaveform() {
      currentAmp = IDLE_AMP;
      targetAmp = IDLE_AMP;
      latestLevel = { rms: 0, peak: 0 };
    }

    function showState(name) {
      Object.values(states).forEach(function(el) { el.classList.remove('active'); });
      if (states[name]) states[name].classList.add('active');
      if (name === 'recording') startWaveform(); else stopWaveform();
    }

    async function copyText(text) {
      if (!text) return;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        try {
          await navigator.clipboard.writeText(text);
        } catch (err) {
          console.error('Failed to copy text:', err);
        }
      }
    }

    copyResultBtn.addEventListener('click', function() { copyText(lastResultText); });
    copyErrorBtn.addEventListener('click', function() { copyText(lastErrorText); });
    reduceMotionQuery.addEventListener?.('change', function() {
      if (reduceMotionQuery.matches) stopWaveform();
      drawWaveform(0.016);
    });

    drawWaveform(0.016);

    // Global API — called by Rust via webview.eval().
    window.typexShowOverlay = function(state) {
      showState(state);
      if (state !== 'error') {
        resetWaveform();
      }
    };

    window.typexHideOverlay = function() {
      Object.values(states).forEach(function(el) { el.classList.remove('active'); });
      resetWaveform();
    };

    window.typexShowError = function(message) {
      lastErrorText = message || '未知错误';
      errorMsg.textContent = lastErrorText;
      showState('error');
    };

    window.typexShowInjected = function(text) {
      lastResultText = text || '';
      injectedPreview.textContent = lastResultText || '结果已写入目标应用';
      showState('injected');
    };

    window.typexAudioLevel = function(level) {
      if (typeof level === 'number') {
        latestLevel = { rms: clamp01(level), peak: clamp01(level) };
      } else if (level) {
        latestLevel = { rms: clamp01(level.rms), peak: clamp01(level.peak) };
      }
    };
  </script>
</body>
</html>
