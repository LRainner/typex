name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update
      - run: sudo apt-get install -y libasound2-dev libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      # If v3 is in the lock, force it back to v2 to avoid trait conflict with brotli.
      # alloc-no-stdlib v3.0.0 (2026-06-14) breaks Allocator<T> compat.
      # TODO: remove once brotli upstream updates.
      - run: |
          cargo generate-lockfile
          if cargo update alloc-no-stdlib:3.0.0 --precise 2.0.4 2>/dev/null; then
            echo "pinned alloc-no-stdlib v3 back to v2.0.4"
          else
            echo "alloc-no-stdlib v3 not in graph, nothing to pin"
          fi
      - run: cargo fmt -- --check
      - run: cargo clippy -- -D warnings
      - run: cargo build
      - run: cargo test
