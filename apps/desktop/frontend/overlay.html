<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>TypeX Overlay</title>
  <style>
    :root {
      --bg: #1a1a22;
      --text: #e4e4ec;
      --accent: #34d399;
      --accent-rgb: 52, 211, 153;
      --dot: #5c5c70;
      --dot-rgb: 92, 92, 112;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f7f7f8;
        --text: #1a1a1e;
        --accent: #10b981;
        --accent-rgb: 16, 185, 129;
        --dot: #d4d4d8;
        --dot-rgb: 212, 212, 216;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: var(--bg);
      overflow: hidden;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      height: 100%;
    }
    .overlay {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 8px 18px;
      height: 100%;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      font-size: 12px;
      color: var(--text);
      -webkit-app-region: drag;
    }

    /* Canvas waveform — pixel-exact, no CSS subpixel issues */
    #waveform {
      display: block;
      /* Disable any browser image smoothing */
      image-rendering: auto;
    }

    /* ── Spinner ── */
    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid var(--text);
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      opacity: 0.5;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .label {
      white-space: nowrap;
      font-weight: 500;
    }

    .state { display: none; align-items: center; gap: 10px; }
    .state.active { display: flex; }

    /* Error state */
    .err-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px; height: 16px;
      border-radius: 50%;
      background: #ef4444;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      flex-shrink: 0;
    }
    #error-msg {
      max-width: 140px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="overlay">
    <div class="state active" id="state-recording">
      <canvas id="waveform"></canvas>
      <span class="label">录音中</span>
    </div>
    <div class="state" id="state-transcribing">
      <div class="spinner"></div>
      <span class="label">正在转译中...</span>
    </div>
    <div class="state" id="state-polishing">
      <div class="spinner"></div>
      <span class="label">润色中...</span>
    </div>
    <div class="state" id="state-error">
      <span class="err-icon">!</span>
      <span class="label" id="error-msg"></span>
    </div>
  </div>

  <script>
    const states = {
      recording: document.getElementById('state-recording'),
      transcribing: document.getElementById('state-transcribing'),
      polishing: document.getElementById('state-polishing'),
      error: document.getElementById('state-error'),
    };
    const errorMsg = document.getElementById('error-msg');

    // ── Canvas waveform setup ──
    var BAR_W = 2;
    var BAR_GAP = 3;
    var NUM_BARS = 11;
    var CANVAS_W = NUM_BARS * BAR_W + (NUM_BARS - 1) * BAR_GAP; // 52px
    var CANVAS_H = 32;

    var canvas = document.getElementById('waveform');
    var ctx = canvas.getContext('2d');
    canvas.width = CANVAS_W;
    canvas.height = CANVAS_H;
    canvas.style.width = CANVAS_W + 'px';
    canvas.style.height = CANVAS_H + 'px';

    // Pre-compute bar center X positions
    var barX = [];
    for (var i = 0; i < NUM_BARS; i++) {
      barX[i] = Math.round(i * (BAR_W + BAR_GAP));
    }

    // Map bar index to x in [-2, 2] for the Siri attenuation envelope
    function barToX(i) {
      return (i / (NUM_BARS - 1) - 0.5) * 4; // → [-2, 2]
    }

    // Pre-compute bell-curve weights: center bars get 1.0, edges ~0.45.
    // This is a fixed shape that scales uniformly with amplitude.
    // Min weight is clamped so ALL bars visibly participate.
    var barWeight = [];
    for (var i = 0; i < NUM_BARS; i++) {
      var x = i / (NUM_BARS - 1) * 4 - 2; // [-2, 2]
      var sigma = 1.5;
      var w = Math.exp(-0.5 * (x / sigma) * (x / sigma));
      barWeight[i] = Math.max(0.45, w); // ensure edge bars are always ≥45% of center
    }

    // ── Multi-oscillator sine wave engine ──
    // Each oscillator is a sine wave at a different spatial frequency.
    // They sum together (constructive/destructive interference) to create
    // rich, organic movement without looking like a simple sine.
    var oscillators = [
      { freq: 0.8, phase: 0.0, speed: 1.0, weight: 0.8 },
      { freq: 1.6, phase: 1.2, speed: 1.3, weight: 0.7 },
      { freq: 2.5, phase: 2.8, speed: 0.8, weight: 0.5 },
      { freq: 4.0, phase: 4.1, speed: 0.6, weight: 0.4 },
      { freq: 6.0, phase: 1.5, speed: 1.7, weight: 0.3 },
    ];

    var currentAmp = 0.22;
    var targetAmp = 0.22;
    var SILENCE_THRESHOLD = 0.006;
    var IDLE_AMP = 0.22;
    var MAX_AMP = 1.0;
    var latestLevel = { rms: 0, peak: 0 };
    var rafId = 0;
    var lastFrameTs = 0;

    function roundedRect(x, y, w, h, r) {
      if (typeof ctx.roundRect === 'function') {
        ctx.roundRect(x, y, w, h, r);
        return;
      }
      r = Math.min(r, w / 2, h / 2);
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
    }

    function clamp01(v) {
      return Number.isFinite(v) ? Math.max(0, Math.min(1, v)) : 0;
    }

    function getThemeColors() {
      var style = getComputedStyle(document.documentElement);
      return {
        accent: style.getPropertyValue('--accent').trim(),
        dot: style.getPropertyValue('--dot').trim(),
      };
    }

    function drawWaveform(dt) {
      var rms = clamp01(latestLevel.rms);
      var peak = clamp01(latestLevel.peak);
      var rawLevel = rms * 0.75 + peak * 0.25;
      if (rawLevel < SILENCE_THRESHOLD) {
        targetAmp = IDLE_AMP;
      } else {
        var v = Math.sqrt(rawLevel * 8.0);
        targetAmp = Math.max(0.35, Math.min(MAX_AMP, v));
      }

      var follow = targetAmp > currentAmp ? 1 - Math.exp(-dt * 18) : 1 - Math.exp(-dt * 7);
      currentAmp += (targetAmp - currentAmp) * follow;
      latestLevel.rms *= Math.exp(-dt * 10);
      latestLevel.peak *= Math.exp(-dt * 14);

      for (var oi = 0; oi < oscillators.length; oi++) {
        var osc = oscillators[oi];
        osc.phase += osc.speed * dt * Math.PI * 2;
        if (osc.phase > Math.PI * 2) osc.phase -= Math.PI * 2;
      }

      var colors = getThemeColors();
      ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
      var centerY = Math.floor(CANVAS_H / 2);
      var maxHalfH = centerY - 2;

      for (var i = 0; i < NUM_BARS; i++) {
        var x = barToX(i);
        var y = 0;
        for (var oi = 0; oi < oscillators.length; oi++) {
          var osc = oscillators[oi];
          y += Math.sin(osc.freq * x + osc.phase) * osc.weight;
        }
        y = y / 2.3;

        var scale = y * barWeight[i] * currentAmp;
        var absScale = Math.abs(scale);
        if (absScale < 0.015) absScale = 0;

        var halfH = Math.max(2, Math.round(absScale * maxHalfH));
        var barTop = centerY - halfH;
        var barH = halfH * 2;

        ctx.fillStyle = barH <= 2 ? colors.dot : colors.accent;
        ctx.beginPath();
        if (barH <= 2) {
          roundedRect(barX[i], centerY - 1, BAR_W, 2, 1);
        } else {
          roundedRect(barX[i], barTop, BAR_W, barH, 1);
        }
        ctx.fill();
      }
    }

    function animationFrame(ts) {
      if (!lastFrameTs) lastFrameTs = ts;
      var dt = Math.min(0.05, Math.max(0.001, (ts - lastFrameTs) / 1000));
      lastFrameTs = ts;
      drawWaveform(dt);
      rafId = requestAnimationFrame(animationFrame);
    }

    function startWaveform() {
      if (!rafId) {
        lastFrameTs = 0;
        rafId = requestAnimationFrame(animationFrame);
      }
    }

    function stopWaveform() {
      if (rafId) {
        cancelAnimationFrame(rafId);
        rafId = 0;
      }
    }

    drawWaveform(0.016);

    // ── State management ──
    function showState(name) {
      Object.values(states).forEach(function(el) { el.classList.remove('active'); });
      if (states[name]) states[name].classList.add('active');
      if (name === 'recording') startWaveform(); else stopWaveform();
    }

    function resetWaveform() {
      currentAmp = IDLE_AMP;
      targetAmp = IDLE_AMP;
      latestLevel = { rms: 0, peak: 0 };
    }

    // ── Global API — called by Rust via webview.eval() ──
    window.typexShowOverlay = function(state) {
      showState(state);
      if (state !== 'error') {
        resetWaveform();
      }
    };

    window.typexHideOverlay = function() {
      Object.values(states).forEach(function(el) { el.classList.remove('active'); });
      resetWaveform();
    };

    window.typexShowError = function(message) {
      errorMsg.textContent = message || '未知错误';
      showState('error');
    };

    window.typexAudioLevel = function(level) {
      if (typeof level === 'number') {
        latestLevel = { rms: clamp01(level), peak: clamp01(level) };
      } else if (level) {
        latestLevel = { rms: clamp01(level.rms), peak: clamp01(level.peak) };
      }
    };
  </script>
</body>
</html>
