# TypeX Configuration

# Existing single-value [asr] / [llm] configs are migrated automatically.

[asr]
active_connection = "default"

[[asr.connections]]
id = "default"
name = "Default ASR"
provider = "mock"         # mock | openai-compatible
# provider = "openai-compatible"
# endpoint = "https://api.openai.com/v1"
# model = "whisper-1"
# api_key = "sk-..."     # or set OPENAI_API_KEY env var
# language = "zh"

[llm]
enabled = false            # set true to enable text optimization
active_connection = "default"
# prompt = """You are a text optimization assistant..."""  # custom system prompt, optional

[[llm.connections]]
id = "default"
name = "Default LLM"
provider = "mock"          # mock | openai-compatible
# provider = "openai-compatible"
# endpoint = "https://api.openai.com/v1"
# model = "gpt-4o-mini"
# api_key = "sk-..."

[pipeline]
performance = "balanced"   # low | balanced | high
plugins = ["filler_remover", "text_cleaner"]

[injector]
method = "clipboard"       # clipboard | platform

[audio]
# device = ""               # device name substring, empty = default
