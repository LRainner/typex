[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/asr",
    "crates/llm",
    "crates/pipeline",
    "crates/injector",
    "crates/config",
    "crates/provider",
    "crates/logging",
    "crates/plugin",
    "crates/audio",
    "apps/cli",
    "apps/desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "BSL-1.1"
repository = "https://github.com/LRainner/typex"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "chrono"] }
tracing-appender = "0.2"
async-trait = "0.1"
bytes = "1"
hound = "3.5"
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }

# Desktop (Tauri)
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-build = "2"
tauri-plugin-global-shortcut = "2"
log = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }

# Internal crates
typex-core = { path = "crates/core" }
typex-asr = { path = "crates/asr" }
typex-llm = { path = "crates/llm" }
typex-pipeline = { path = "crates/pipeline" }
typex-injector = { path = "crates/injector" }
typex-config = { path = "crates/config" }
typex-provider = { path = "crates/provider" }
typex-logging = { path = "crates/logging" }
typex-plugin = { path = "crates/plugin" }
typex-audio = { path = "crates/audio" }
